<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple, clean to-do list. Your tasks are saved in this browser.">
  <title>My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef1f4;
      --surface: #ffffff;
      --ink: #1b2330;
      --ink-soft: #5b6676;
      --ink-faint: #9aa3b0;
      --line: #dde2e9;
      --accent: #0f766e;
      --accent-soft: #d7efec;
      --danger: #b42318;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(27, 35, 48, 0.06), 0 8px 24px rgba(27, 35, 48, 0.06);
      --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: clamp(24px, 6vw, 72px) 16px;
    }

    .sheet {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .top h1 {
      margin: 0;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .top p {
      margin: 4px 0 0;
      color: var(--ink-soft);
    }

    /* Input */
    .add {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 6px;
    }

    .add input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      font: inherit;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    .add input::placeholder { color: var(--ink-faint); }

    .btn {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #0c5f58; }

    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      padding: 8px 12px;
    }

    .btn-ghost:hover { color: var(--ink); background: rgba(27, 35, 48, 0.05); }

    .btn-ghost:disabled { opacity: 0.4; cursor: default; background: transparent; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Filters */
    .filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .segmented {
      display: inline-flex;
      background: rgba(27, 35, 48, 0.06);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .segmented button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .segmented button[aria-selected="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(27, 35, 48, 0.1);
      font-weight: 600;
    }

    /* List */
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .item:last-child { border-bottom: 0; }

    .item:hover .delete { opacity: 1; }

    /* Custom checkbox */
    .check {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 2px solid #c4ccd6;
      border-radius: 7px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: var(--surface);
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .check::after {
      content: "";
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) scale(0);
      transform-origin: center;
      transition: transform 200ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
      margin-top: -2px;
    }

    .check:hover { border-color: var(--accent); }

    .check:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check:checked::after { transform: rotate(45deg) scale(1); }

    .text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      outline: none;
      border-radius: 6px;
      padding: 1px 4px;
      margin: 0 -4px;
    }

    .text[contenteditable="true"] {
      background: var(--accent-soft);
      cursor: text;
    }

    .item.done .text {
      color: var(--ink-faint);
      text-decoration: line-through;
      text-decoration-color: rgba(27, 35, 48, 0.25);
    }

    .delete {
      flex: none;
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 150ms ease, color 150ms ease, background-color 150ms ease;
    }

    .delete:hover { color: var(--danger); background: rgba(180, 35, 24, 0.08); }

    /* Touch screens have no hover, so keep the delete button visible */
    @media (hover: none) {
      .delete { opacity: 1; }
    }

    .empty {
      margin: 0;
      padding: 40px 16px;
      text-align: center;
      color: var(--ink-soft);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .empty[hidden] { display: none; }

    /* Footer */
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Motion */
    .item-enter { animation: enter 220ms ease-out; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 420px) {
      .top h1 { font-size: 1.85rem; }
      .filters { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="top">
      <h1>My tasks</h1>
      <p id="today"></p>
    </header>

    <form id="add-form" class="add" autocomplete="off">
      <label for="new-task" class="sr-only">New task</label>
      <input id="new-task" type="text" placeholder="Add a task and press Enter" maxlength="200" required>
      <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <div class="filters">
      <div class="segmented" role="tablist" aria-label="Filter tasks">
        <button type="button" role="tab" data-filter="all" aria-selected="true">All</button>
        <button type="button" role="tab" data-filter="active" aria-selected="false">Active</button>
        <button type="button" role="tab" data-filter="done" aria-selected="false">Done</button>
      </div>
      <span id="count" class="foot"></span>
    </div>

    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="foot">
      <span id="summary"></span>
      <button id="clear-done" class="btn btn-ghost" type="button">Clear completed</button>
    </footer>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "my-tasks-v1";

      const els = {
        form: document.getElementById("add-form"),
        input: document.getElementById("new-task"),
        list: document.getElementById("list"),
        empty: document.getElementById("empty"),
        today: document.getElementById("today"),
        count: document.getElementById("count"),
        summary: document.getElementById("summary"),
        clearDone: document.getElementById("clear-done"),
        tabs: document.querySelectorAll(".segmented button"),
      };

      let tasks = load();
      let filter = "all";
      let lastAddedId = null;

      /* ---------- Storage ---------- */

      function load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {
          // Storage may be full or disabled; the list still works for this session.
        }
      }

      /* ---------- Actions ---------- */

      function addTask(text) {
        const clean = text.trim();
        if (!clean) return;
        const task = {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          text: clean,
          done: false,
          createdAt: Date.now(),
        };
        tasks.unshift(task);
        lastAddedId = task.id;
        save();
        render();
      }

      function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        task.done = !task.done;
        save();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        save();
        render();
      }

      function editTask(id, text) {
        const task = tasks.find(t => t.id === id);
        const clean = text.trim();
        if (!task) return;
        if (clean) task.text = clean;
        save();
        render();
      }

      function clearCompleted() {
        tasks = tasks.filter(t => !t.done);
        save();
        render();
      }

      /* ---------- Rendering ---------- */

      function visibleTasks() {
        if (filter === "active") return tasks.filter(t => !t.done);
        if (filter === "done") return tasks.filter(t => t.done);
        return tasks;
      }

      function buildItem(task) {
        const li = document.createElement("li");
        li.className = "item" + (task.done ? " done" : "");
        li.dataset.id = task.id;
        if (task.id === lastAddedId) li.classList.add("item-enter");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.className = "check";
        check.checked = task.done;
        check.setAttribute("aria-label", "Mark as " + (task.done ? "not done" : "done"));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = task.text;
        text.title = "Double-click to edit";

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete task: " + task.text);

        li.append(check, text, del);
        return li;
      }

      function render() {
        const shown = visibleTasks();
        const remaining = tasks.filter(t => !t.done).length;
        const doneCount = tasks.length - remaining;

        els.list.replaceChildren(...shown.map(buildItem));

        els.empty.hidden = shown.length > 0;
        els.empty.textContent = emptyMessage();

        els.count.textContent = tasks.length ? `${remaining} left` : "";
        els.summary.textContent = tasks.length
          ? `${doneCount} of ${tasks.length} completed`
          : "";
        els.clearDone.disabled = doneCount === 0;

        els.tabs.forEach(tab => {
          tab.setAttribute("aria-selected", String(tab.dataset.filter === filter));
        });

        lastAddedId = null;
      }

      function emptyMessage() {
        if (tasks.length === 0) return "Nothing here yet. Add your first task above.";
        if (filter === "active") return "No active tasks. Everything is done.";
        if (filter === "done") return "No completed tasks yet.";
        return "";
      }

      function showDate() {
        els.today.textContent = new Date().toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
        });
      }

      /* ---------- Events ---------- */

      els.form.addEventListener("submit", e => {
        e.preventDefault();
        addTask(els.input.value);
        els.input.value = "";
        els.input.focus();
      });

      els.list.addEventListener("change", e => {
        if (!e.target.classList.contains("check")) return;
        toggleTask(e.target.closest(".item").dataset.id);
      });

      els.list.addEventListener("click", e => {
        const btn = e.target.closest(".delete");
        if (!btn) return;
        deleteTask(btn.closest(".item").dataset.id);
      });

      // Double-click a task to edit it inline.
      els.list.addEventListener("dblclick", e => {
        const span = e.target.closest(".text");
        if (!span) return;
        const id = span.closest(".item").dataset.id;
        const original = tasks.find(t => t.id === id)?.text ?? "";

        span.contentEditable = "true";
        span.focus();
        document.getSelection().selectAllChildren(span);

        const finish = commit => {
          span.removeEventListener("blur", onBlur);
          span.removeEventListener("keydown", onKey);
          span.contentEditable = "false";
          if (commit) editTask(id, span.textContent);
          else span.textContent = original;
        };

        const onBlur = () => finish(true);
        const onKey = ev => {
          if (ev.key === "Enter") { ev.preventDefault(); span.blur(); }
          if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
        };

        span.addEventListener("blur", onBlur);
        span.addEventListener("keydown", onKey);
      });

      els.tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          filter = tab.dataset.filter;
          render();
        });
      });

      els.clearDone.addEventListener("click", clearCompleted);

      /* ---------- Init ---------- */

      showDate();
      render();
    })();
  </script>
</body>
</html>
